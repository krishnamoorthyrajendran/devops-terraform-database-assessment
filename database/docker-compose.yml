services:
  postgres:
    image: postgres:16
    container_name: hotel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: hotel_admin
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - ./seed/002_seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U hotel_admin -d hotel_db
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: